# The floor for every teammate's computer, checked by Otari's /hooks/check before a command or file
# access runs. "required" gates refuse; "advisory" gates make Peeblo ask a person first.
# Override with PEEBLO_POLICY_FILE.
schema_version: "1.0"
policy:
  id: peeblo/teammate-floor
gates:
  - id: no-force-push
    type: command
    runs: [pre_tool_use.command]
    enforcement: required
    # Also a "+" refspec (git push origin +main) and deleting a remote branch, which rewrite or drop history too.
    forbidden: ["git push --force", "git push -f", "git push --force-with-lease", "git push origin +", "git push -u origin +", " +refs/", " +main", " +master", "git push --delete", "git push origin :"]
    message: Force-pushing rewrites other people's history, so teammates never do it.
  - id: no-wiping-disks
    type: command
    runs: [pre_tool_use.command]
    enforcement: required
    forbidden: ["rm -rf /", "rm -rf ~", "rm -rf /workspace", "mkfs", "dd if=/dev/zero"]
    message: That would wipe the computer's disk.
  - id: no-credentials-in-git
    type: command
    runs: [pre_tool_use.command]
    enforcement: required
    # A token in a remote URL or git config is stored in plain text and travels with the checkout.
    forbidden: ["x-access-token", "GH_TOKEN}@", "GH_TOKEN@", "git remote add", "git remote set-url", "insteadOf", "insteadof"]
    message: Credentials never go into git remotes or config. Publish with repo_publish, which pushes your branch or an open PR's branch.
  - id: ask-before-push
    type: command
    runs: [pre_tool_use.command]
    enforcement: advisory
    forbidden: ["git push"]
    message: Pushing sends work outside the computer, so a person approves it first.
  - id: ask-before-publish
    type: command
    runs: [pre_tool_use.command]
    enforcement: advisory
    forbidden: ["npm publish", "pnpm publish", "docker push", "gh release create"]
    message: Publishing is visible outside the team, so a person approves it first.
  - id: ask-before-github-writes
    type: command
    runs: [pre_tool_use.command]
    enforcement: advisory
    # The computer's GitHub token is added on the way out, so writes through gh or GitHub's API (a merge, a comment,
    # closing an issue) would skip the connector's cards. They ask a person, like a push.
    forbidden: ["gh pr merge", "gh pr close", "gh pr comment", "gh pr review", "gh pr edit", "gh issue", "gh api", "gh repo", "gh workflow", "gh secret", "api.github.com"]
    message: Changing things on GitHub (merges, comments, issues, settings) is visible outside the computer, so a person approves it first.
  - id: no-secret-files
    type: path
    runs: [pre_tool_use.read_target, pre_tool_use.edit_target]
    enforcement: required
    # One "**" per glob (Otari's rule); ".aws/*" rather than its credentials file by name, which a web
    # firewall in front of hosted Otari refuses to let through.
    forbidden: ["**/.env", "**/.env.*", "**/id_rsa*", "**/id_ed25519*", "**/.ssh/*", "**/.aws/*"]
    message: Secret files stay closed; ask the owner for what you need.
