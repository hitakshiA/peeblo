<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><defs><radialGradient id="g" cx="75%" cy="30%" r="70%"><stop offset="0" stop-color="#1f2a22"/><stop offset="0.55" stop-color="#12110f"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a948a"/></marker><marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7fd6a4"/></marker></defs><rect width="1280" height="600" rx="18" fill="#12110f"/><rect width="1280" height="600" rx="18" fill="url(#grid)"/><text x="40" y="52" font-size="26" font-weight="700" fill="#efebe3" letter-spacing="-0.6">The Peeblo agent harness</text><text x="40" y="80" font-size="15" fill="#9a948a">The model decides what to investigate and propose. Code decides what is allowed to change.</text><rect x="40" y="120" width="250" height="190" rx="14" fill="#1c1a17" stroke="#34302a"/><text x="62" y="156" font-size="19" font-weight="650" fill="#efebe3">Triggers</text><text x="62" y="186" font-size="14.5" fill="#9a948a">• Stripe webhooks (signed, deduped)</text><text x="62" y="211" font-size="14.5" fill="#9a948a">• Scheduled wake-ups</text><text x="62" y="236" font-size="14.5" fill="#9a948a">• Approval decisions</text><text x="62" y="261" font-size="14.5" fill="#9a948a">• Live console</text><rect x="350" y="120" width="330" height="190" rx="14" fill="#1c1a17" stroke="#7fd6a4"/><text x="372" y="156" font-size="19" font-weight="650" fill="#7fd6a4">Reasoning agent</text><text x="372" y="186" font-size="14.5" fill="#9a948a">• Plans and re-plans the case</text><text x="372" y="211" font-size="14.5" fill="#9a948a">• Picks from reusable read tools</text><text x="372" y="236" font-size="14.5" fill="#9a948a">• Reads every app through tools</text><text x="372" y="261" font-size="14.5" fill="#9a948a">• Proposes changes with evidence</text><rect x="350" y="350" width="330" height="150" rx="14" fill="#1c1a17" stroke="#34302a"/><text x="372" y="386" font-size="19" font-weight="650" fill="#efebe3">Case memory</text><text x="372" y="416" font-size="14.5" fill="#9a948a">• Evidence, plan and decisions</text><text x="372" y="441" font-size="14.5" fill="#9a948a">• Operation intent log</text><text x="372" y="466" font-size="14.5" fill="#9a948a">• Resumes any run after a crash</text><line x1="720" y1="100" x2="720" y2="560" stroke="#e8c07a" stroke-dasharray="7 7"/><text x="728" y="116" font-size="12" fill="#e8c07a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="1.5">WRITE BOUNDARY</text><rect x="760" y="120" width="480" height="250" rx="14" fill="#1c1a17" stroke="#e8c07a"/><text x="782" y="156" font-size="19" font-weight="650" fill="#e8c07a">Executor (deterministic)</text><text x="782" y="186" font-size="14.5" fill="#9a948a">1  Authority from policy: autonomous · AR approver · CFO</text><text x="782" y="211" font-size="14.5" fill="#9a948a">2  Approval bound to the exact change, expires in 48h</text><text x="782" y="236" font-size="14.5" fill="#9a948a">3  Idempotency key logged before any write</text><text x="782" y="261" font-size="14.5" fill="#9a948a">4  Uncertain write? Reconcile with the provider first</text><text x="782" y="286" font-size="14.5" fill="#9a948a">5  Verify by re-reading the app after every write</text><text x="782" y="311" font-size="14.5" fill="#9a948a">6  Stale check: re-read state before executing</text><rect x="760" y="410" width="480" height="150" rx="14" fill="#1c1a17" stroke="#34302a"/><text x="782" y="446" font-size="19" font-weight="650" fill="#efebe3">Business apps</text><svg x="790" y="466" width="24" height="24" viewBox="0 0 