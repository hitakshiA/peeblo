520" rx="18" fill="url(#grid)"/><text x="40" y="54" font-size="26" font-weight="700" fill="#efebe3" letter-spacing="-0.6">When a write succeeds but the response never arrives</text><text x="40" y="84" font-size="15" fill="#9a948a">Explanatory animation of the Arga Stripe-twin test (run 0c323cd4). The real run log and recording are linked below.</text><path class="flow" d="M40 124 H1240" stroke="#7fd6a4" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="8 12" fill="none"/><g class="s0"><rect x="40" y="150" width="220" height="280" rx="16" fill="#1c1a17" stroke="#7fd6a4" stroke-opacity="0.6"/><circle cx="76" cy="192" r="18" fill="#7fd6a4" fill-opacity="0.16" stroke="#7fd6a4"/><text x="76" y="198" font-size="16" font-weight="700" fill="#7fd6a4" text-anchor="middle">1</text><text x="62" y="252" font-size="21" font-weight="700" fill="#efebe3">Approved write</text><text x="62" y="300" font-size="15" fill="#9a948a">Create replacement invoice</text><text x="62" y="328" font-size="15" fill="#9a948a">Stripe accepts it</text></g><g class="s1"><rect x="284" y="150" width="220" height="280" rx="16" fill="#1c1a17" stroke="#f08a74" stroke-opacity="0.6"/><circle cx="320" cy="192" r="18" fill="#f08a74" fill-opacity="0.16" stroke="#f08a74"/><text x="320" y="198" font-size="16" font-weight="700" fill="#f08a74" text-anchor="middle">2</text><text x="306" y="252" font-size="21" font-weight="700" fill="#efebe3">Response lost</text><text x="306" y="300" font-size="15" fill="#9a948a">Timeout before the reply</text><text x="306" y="328" font-size="15" fill="#9a948a">Outcome unknown</text><path d="M434 380 l30 30 M464 380 l-30 30" stroke="#f08a74" stroke-width="4" stroke-linecap="round"/></g><g class="s2"><rect x="528" y="150" width="220" height="280" rx="16" fill="#1c1a17" stroke="#e8c07a" stroke-opacity="0.6"/><circle cx="564" cy="192" r="18" fill="#e8c07a" fill-opacity="0.16" stroke="#e8c07a"/><text x="564" y="198" font-size="16" font-weight="700" fill="#e8c07a" text-anchor="middle">3</text><text x="550" y="252" font-size="21" font-weight="700" fill="#efebe3">Marked uncertain</text><text x="550" y="300" font-size="15" fill="#9a948a">Intent was logged first</text><text x="550" y="328" font-size="15" fill="#9a948a">No blind retry</text></g><g class="s3"><rect x="772" y="150" width="220" height="280" rx="16" fill="#1c1a17" stroke="#7fd6a4" stroke-opacity="0.6"/><circle cx="808" cy="192" r="18" fill="#7fd6a4" fill-opacity="0.16" stroke="#7fd6a4"/><text x="808" y="198" font-size="16" font-weight="700" fill="#7fd6a4" text-anchor="middle">4</text><text x="794" y="252" font-size="21" font-weight="700" fill="#efebe3">Reconcile</text><text x="794" y="300" font-size="15" fill="#9a948a">Re-read Stripe by key</text><text x="794" y="328" font-size="15" fill="#9a948a">Finds the invoice it made</text></g><g class="s4"><rect x="1016" y="150" width="220" height="280" rx="16" fill="#1c1a17" stroke="#7fd6a4" stroke-opacity="0.6"/><circle cx="1052" cy="192" r="18" fill="#7fd6a4" fill-opacity="0.16" stroke="#7fd6a4"/><text x="1052" y="198" font-size="16" font-weight="700" fill="#7fd6a4" text-anchor="middle">5</text><text x="1038" y="252" font-size="21" font-weight="700" fill="#efebe3">Skip + verify</text><text x="1038" y="300" font-size="15" fill="#9a948a">No second invoice created</text><text x="1038" y="328" font-size="15" fill="#9a948a">Exactly one replacement</text><path d="M1166 396 l12 12 24 -26" stroke="#7fd6a4" stroke-width="4" fill="none" stroke-linecap="round"/></g><text x="40" y="480" font-size="14" fill="#9a948a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Result read back from the twin: original void · exactly_one_replacement: true · open to Eastbridge Logistics</text></svg>