<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Inter, Helvetica, Arial, sans-serif">
  <rect width="960" height="520" rx="18" fill="#0f1411"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7be0a6"/></marker>
    <style>.box{fill:#161d19;stroke:#2c3a32;stroke-width:1.5}.h{fill:#eef5f0;font-size:15px;font-weight:600}.t{fill:#9fb3a7;font-size:12px}.ln{stroke:#7be0a6;stroke-width:1.8;fill:none;marker-end:url(#a)}.dash{stroke:#5b6b62;stroke-width:1.5;stroke-dasharray:5 5;fill:none;marker-end:url(#a)}.acc{fill:#123524;stroke:#3f9e6b;stroke-width:1.5}</style>
  </defs>
  <text x="32" y="44" fill="#eef5f0" font-size="20" font-weight="700">Peeblo architecture</text>
  <text x="32" y="66" class="t">The model proposes. Deterministic code decides, executes, and verifies. Work survives any single run.</text>

  <rect class="box" x="32" y="100" width="190" height="150" rx="12"/>
  <text x="50" y="128" class="h">Triggers</text>
  <text x="50" y="154" class="t">• @Peeblo tag in Slack</text>
  <text x="50" y="176" class="t">• Durable wake-ups</text>
  <text x="50" y="198" class="t">• Approval decisions</text>
  <text x="50" y="220" class="t">• Console assignment</text>

  <rect class="box" x="272" y="100" width="210" height="150" rx="12"/>
  <text x="290" y="128" class="h">Case store (SQLite)</text>
  <text x="290" y="154" class="t">cases · evidence · events</text>
  <text x="290" y="176" class="t">operation intent log</text>
  <text x="290" y="198" class="t">approvals · wake-ups · runs</text>
  <text x="290" y="220" class="t">context rebuilt each run</text>

  <rect class="acc" x="532" y="100" width="200" height="150" rx="12"/>
  <text x="550" y="128" class="h">Reasoning loop</text>
  <text x="550" y="154" class="t">Cline SDK agent runtime</text>
  <text x="550" y="176" class="t">ClinePass GLM-5.3 Flash</text>
  <text x="550" y="198" class="t">17 reusable tools</text>
  <text x="550" y="220" class="t">no per-case scripts</text>

  <rect class="box" x="782" y="100" width="146" height="150" rx="12"/>
  <text x="800" y="128" class="h">Lemma</text>
  <text x="800" y="154" class="t">trace per run</text>
  <text x="800" y="176" class="t">model + tool spans</text>
  <text x="800" y="198" class="t">outcome span</text>

  <rect class="box" x="272" y="300" width="460" height="100" rx="12"/>
  <text x="290" y="328" class="h">Authorization and action executor</text>
  <text x="290" y="354" class="t">policy authority ($250 / $5,000 / CFO) · Slack approval bound to exact change</text>
  <text x="290" y="376" class="t">idempotency key · resumable steps · reconcile before retry · verify by re-reading</text>

  <rect class="box" x="32" y="440" width="896" height="56" rx="12"/>
  <text x="50" y="474" class="h">Connected apps</text>
  <text x="190" y="474" class="t">Stripe · QuickBooks · Salesforce · HubSpot · Dropbox · Notion · Slack · Jira</text>

  <rect class="box" x="782" y="300" width="146" height="100" rx="12"/>
  <text x="800" y="328" class="h">Arga</text>
  <text x="800" y="354" class="t">service twins for</text>
  <text x="800" y="376" class="t">repeatable tests</text>

  <path class="ln" d="M222 175H270"/>
  <path class="ln" d="M482 175H530"/>
  <path class="dash" d="M732 175H780"/>
  <path class="ln" d="M632 250V298"/>
  <path class="ln" d="M500 400V438"/>
  <path class="ln" d="M400 250V298"/>
  <text x="408" y="282" class="t">wake-ups</text>
  <path class="dash" d="M782 350H734"/>
  <path class="ln" d="M120 438V252"/>
  <text x="128" y="360" class="t">webhooks later</text>
</svg>
