blank_issues_enabled: false
contact_links:
  - name: Security problem
    url: https://docs.github.com/en/code-security/security-advisories/guidance-on-reporting-and-writing-information-about-vulnerabilities/privately-reporting-a-security-vulnerability
    about: Report it privately (Security → Report a vulnerability on this repository), never in a public issue.
  - name: An Otari bug (gateway, dashboard, routing, budgets)
    url: https://github.com/mozilla-ai/otari/issues
    about: If Otari itself misbehaves with a plain request, report it to Otari so every user gets the fix.
