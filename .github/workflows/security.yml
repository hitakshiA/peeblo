name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Secrets committed anywhere in the history (the gitleaks CLI, pinned and checked against its release checksum).
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.24.3
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the history
        run: ./gitleaks git --redact --verbose .

  # Known vulnerabilities in the locked dependencies (core, console and the landing page).
  dependencies:
    # What the reusable workflow declares; it uploads nothing here (upload-sarif is off).
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      # Code scanning isn't available on this repository; the job fails on a finding instead.
      upload-sarif: false
      scan-args: |-
        --lockfile=pnpm-lock.yaml
        --lockfile=console/pnpm-lock.yaml
        --lockfile=site/package-lock.json
