version: 2
updates:
  # The workflow actions are pinned by commit; this moves the pins (and their version comments) as releases ship.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The images are pinned by digest, which goes stale the same way.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Core and the console have their own lockfiles. Minor and patch bumps come as one weekly pull request each.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      core:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/console"
    schedule:
      interval: "weekly"
    groups:
      console:
        update-types: ["minor", "patch"]
