name: peeblo

services:
  db:
    image: postgres:18-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    environment:
      POSTGRES_USER: peeblo
      POSTGRES_DB: peeblo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peeblo -d peeblo"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]
    restart: unless-stopped

  peeblo:
    profiles: [linux]
    build: .
    image: peeblo:dev
    env_file: .env
    environment:
      DATABASE_URL: postgres://peeblo:${POSTGRES_PASSWORD}@db:5432/peeblo
      PEEBLO_API_HOST: 0.0.0.0
      PEEBLO_INGRESS_HOST: 0.0.0.0
      # Inside the container the ports are fixed; .env's ports choose the host side below.
      PEEBLO_API_PORT: "7340"
      PEEBLO_INGRESS_PORT: "8787"
      PEEBLO_SLACK_CONFIG_FILE: /run/peeblo/slack-config.json
    # Teammate computers are Gondolin micro-VMs and need KVM (./peeblo sets KVM_GID to /dev/kvm's group).
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:-994}"
    stop_grace_period: 30s
    # An init process reaps the computers' QEMU processes when they exit.
    init: true
    # The core API stays on loopback; the ingress is what a reverse proxy or tunnel points at.
    ports:
      - "127.0.0.1:${PEEBLO_API_PORT:-7340}:7340"
      - "127.0.0.1:${PEEBLO_INGRESS_PORT:-8787}:8787"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - data:/data
      # Optional: a Slack token file from .env (the console's setup takes the token instead).
      - ${PEEBLO_SLACK_CONFIG_FILE:-/dev/null}:/run/peeblo/slack-config.json:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [internal, egress]
    restart: unless-stopped

networks:
  # The database has no route out.
  internal:
    internal: true
  egress: {}

volumes:
  db: {}
  data: {}
