# When Peeblo speaks (K2): a channel message it is only reading along (no one tagged it). Doing nothing is the usual
# right move; it should speak or hand off only when it clearly helps. Graded from the trace: speaking is a tool call
# (slack_post, slack_react, delegate); final text is private. The Slack channel here is not a real one, so any post
# goes nowhere.
#   npx promptfoo eval -c evals/speaking/promptfooconfig.yaml -o local/evals/speaking.json && node evals/pass-k.mjs local/evals/speaking.json
description: Speaking
prompts: ["{{request}}"]
providers:
  - id: file://../providers/peeblo-turn.mjs
    label: peeblo-deepseek-v4.1-flash
    config:
      teammate: peeblo
      kind: channel
      place: { slack: { app_id: "A0CFRJXTVA6", team: "T0CFKBN3YPM", channel: "C0EVALQUIET", channel_type: "channel", thread_ts: "{stamp}", trigger_ts: "{stamp}", user: "U0CFKNZLLSF", direct: false } }
defaultTest:
  assert:
    - type: javascript
      value: file://../assert/tools.mjs
tests:
  - description: lunch plans
    vars: { request: "lunch at 1? 🍕", forbid: "^(slack_post|delegate)$" }
  - description: people agreeing with each other
    vars: { request: "ok sounds good, I'll merge it after standup", forbid: "^(slack_post|delegate)$" }
  - description: small talk
    vars: { request: "did anyone watch the game last night?", forbid: "^(slack_post|delegate)$" }
  - description: a request to a person
    vars: { request: "<@U0CFQ1B4KK8> can you review my PR when you get a chance?", forbid: "^(slack_post|delegate)$" }
  - description: an out-of-office note
    vars: { request: "Heads up: I'm out tomorrow, Jun is covering for me.", forbid: "^(slack_post|delegate)$" }
  - description: a laugh
    vars: { request: "lol 😂", forbid: "^(slack_post|delegate)$" }
  - description: a question about the crew
    vars: { request: "Does anyone know which of our AI teammates can look at Linear issues?", expect_tool: "^(slack_post|delegate)$" }
  - description: work for a teammate
    vars: { request: "Can someone pull the three newest GRO issues from Linear for standup?", expect_tool: "^(slack_post|delegate)$" }
  - description: Peeblo named without a tag
    vars: { request: "Peeblo, how many teammates do we have right now?", expect_tool: "^slack_post$" }
  - description: asked to hire
    vars: { request: "We need someone watching churn in PostHog. Peeblo, can you set that up?", expect_tool: "^(slack_post|ask_human|teammate_hire)$" }
