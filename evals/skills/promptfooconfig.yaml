# Skills load (K4): for a hire, a company setup, a channel message, a routine, Otari settings and a review, the
# teammate opens the matching skill with read_skill before acting. Graded from the trace (which skill was read).
# Approvals are declined, so nothing is written.
#   npx promptfoo eval -c evals/skills/promptfooconfig.yaml -o local/evals/skills.json && node evals/pass-k.mjs local/evals/skills.json
description: Skills
prompts: ["{{request}}"]
providers:
  - id: file://../providers/peeblo-turn.mjs
    label: peeblo-deepseek-v4.1-flash
    config: { teammate: peeblo }
defaultTest:
  assert:
    - type: javascript
      value: file://../assert/tools.mjs
tests:
  - description: hire
    vars: { request: "I need a teammate that watches our Stripe refunds and flags anything over $500. Read-only, $10 a month.", expect_skill: hiring-a-teammate }
  - description: hire (vague)
    vars: { request: "Can you get us someone to help with release notes?", expect_skill: hiring-a-teammate }
  - description: company setup
    vars: { request: "We just installed Peeblo. Set up company memory from our Linear, GitHub and PostHog so the crew knows how we work.", expect_skill: company-setup }
  - description: company setup (short)
    vars: { request: "Please do the first-time setup for our company.", expect_skill: company-setup }
  - description: routine
    vars: { request: "Every Monday at 9am Berlin time, post the three newest GRO issues here. If there are none, stay quiet.", expect_skill: writing-routines }
  - description: Otari setting
    vars: { request: "Turn off web search for the whole team in Otari.", expect_skill: changing-otari-settings }
  - description: delegate a job
    vars: { request: "Have someone on the crew summarize this week's GRO issues for standup tomorrow.", expect_skill: writing-job-specs }
  - description: remember a fact
    vars: { request: "Remember that our fiscal year starts on February 1st.", expect_skill: tidying-memory }
  - description: channel message (reading along)
    vars:
      request: "anyone know if the deploy finished?"
      expect_skill: channel-etiquette
      kind: channel
      place: { slack: { app_id: "A0CFRJXTVA6", team: "T0CFKBN3YPM", channel: "C0EVALQUIET", channel_type: "channel", thread_ts: "{stamp}", trigger_ts: "{stamp}", user: "U0CFKNZLLSF", direct: false } }
